resources:
  jobs:
    azure_databricks_pipeline:
      name: "azure-databricks-pipeline"

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/bronze/bronze.ipynb

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ../notebooks/silver/silver.ipynb

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../notebooks/gold/gold.ipynb

      max_concurrent_runs: 1
